name: Build Android APK

# Собирает APK NurBooks Mobile по push в main, по тегу v* и вручную.
# Запускать вручную можно из вкладки Actions -> Build Android APK -> Run workflow.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  BUILD_NUMBER: ${{ github.run_number }}

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "flet==0.24.1"
          pip install -r requirements.txt

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.5'

      - name: Disable Flutter analytics
        run: flutter config --no-analytics

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses

      - name: Patch build template (wakelock_plus fix)
        run: |
          git clone --quiet https://github.com/flet-dev/flet-build-template.git "${RUNNER_TEMP}/flet-build-template"
          cd "${RUNNER_TEMP}/flet-build-template"
          git checkout --quiet 0.24.1
          sed -i 's/wakelock_plus:.*/wakelock_plus: 1.2.8/' '{{cookiecutter.out_dir}}/pubspec.yaml'
          grep wakelock '{{cookiecutter.out_dir}}/pubspec.yaml'

      - name: Build Android APK
        run: |
          flet build apk --exclude server tests build --verbose --build-number "${BUILD_NUMBER}" --template "${RUNNER_TEMP}/flet-build-template"

      - name: List build output
        run: |
          ls -lh build/apk

      - name: Delete old artifacts (free storage quota)
        uses: actions/github-script@v7
        with:
          script: |
            const res = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            for (const a of res.data.artifacts) {
              if (a.name === 'nurbooks-mobile-apk') {
                console.log('Deleting old artifact: ' + a.id);
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: a.id,
                });
              }
            }

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nurbooks-mobile-apk
          path: build/apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 30