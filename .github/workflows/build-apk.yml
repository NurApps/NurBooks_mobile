name: Build Android APK

# Собирает APK NurBooks Mobile по push в main, по тегу v* и вручную.
# Запускать вручную можно из вкладки Actions -> Build Android APK -> Run workflow.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  BUILD_NUMBER: ${{ github.run_number }}

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "flet==0.24.1"
          pip install -r requirements.txt

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Disable Flutter analytics
        run: flutter config --no-analytics

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses

      - name: Build Android APK
        run: |
          flet build apk --verbose --build-number "${BUILD_NUMBER}"

      - name: List build output
        run: |
          ls -lh build/apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nurbooks-mobile-apk
          path: build/apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 30