[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "server"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]

[tool.flet]
org = "com.nurapps"
product = "NurBooks"

[tool.flet.flutter.pubspec.dependency_overrides]
wakelock_plus = "1.2.8"
